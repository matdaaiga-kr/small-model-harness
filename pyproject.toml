[project]
name = "local-llm-harness"
version = "0.1.0"
description = "MacBook Air M2 (16GB) 위 로컬 LLM 에이전트 하네스 — 학습 프로젝트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "sentence-transformers>=3.0",
    "lancedb>=0.15",
    "rank-bm25>=0.2",
    "kiwipiepy>=0.18",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "psutil>=5.9",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
