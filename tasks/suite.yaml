# 위키 질의 태스크 스위트 (docs/03) — 정답 페이지는 실제 위키 내용 기반.
# expect.pages: 이 중 하나라도 상위 k 페이지에 들면 hit.
- id: q-001
  question: "크래프톤 정글에서 pintos 프로젝트는 어떤 내용이었지?"
  expect:
    pages: [정글-pintos]
    must_cite: true
    rubric: "OS 커널 구현 과제(스레드/유저프로그램/VM 등) 언급"

- id: q-002
  question: "malloc 구현에서 가용 블록들을 어떻게 연결해서 관리했지?"
