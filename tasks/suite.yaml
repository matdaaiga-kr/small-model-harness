    rubric: "두 프로젝트의 인증 방식을 각각 근거와 함께 비교"

- id: q-102
  question: "malloc 과제에서 암묵적 가용 리스트를 명시적으로 바꾼 이유가 뭐고, 배치 정책은 최종적으로 뭘 골랐어?"
