# ── 에이전트 압박 태스크 (M3) — 멀티홉과 함정으로 하네스 계층을 실제로 발동시킨다 ──
- id: q-101
  question: "실시간 테트리스하고 판옵티콘 프로젝트에서 각각 사용자 인증을 어떻게 처리했는지 비교해줘"
