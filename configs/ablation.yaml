# A/B 실험 정의 (docs/03). `harness eval ablation --exp <이름>`으로 실행.
experiments:

  # M3 (완료·기록: lab-notes/003) — 유효율 사다리. 72런 전 설정 100%로 null result.
  m3-validity:
    configs:
      baseline:   { validator: false, retry: false, guardrails: false }
      +validator: { validator: true,  retry: false, guardrails: false }
      +retry:     { validator: true,  retry: true,  guardrails: false }
      full:       { validator: true,  retry: true,  guardrails: true }
    tasks: [q-001, q-008, q-014, q-020, q-101, q-102, q-103, q-104, q-105, q-106]
    repeats: 1

  # M4 — 탐색 소극성 공략: 멀티홉 계획 강제 개입 2종의 효과 측정.
  # 소형 모델 분산 대응으로 3회 반복 (docs/03).
  m4-planner:
    configs:
      control:   { validator: true, retry: true, guardrails: true }
      +planner:  { validator: true, retry: true, guardrails: true, planner_prompt: true }
      +evidence: { validator: true, retry: true, guardrails: true, evidence_check: true }
    tasks: [q-101, q-102, q-103, q-107, q-108, q-109, q-110, q-111]
    repeats: 3
